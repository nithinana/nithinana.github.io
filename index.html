<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>nithinana</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    :root {
      --wall-a: #eef1f7;
      --wall-b: #e4e9f2;
      --blob1: #e4e9f2;
      --blob2: #d4dbec;
      --blob3: #eef1f7;
      --glass: rgba(255, 255, 255, 0.6);
      --glass-brd: rgba(16, 24, 38, 0.06);
      --text: #0f172a;
      --muted: #475569;
      --dim: #94a3b8;
      --accent: #0f172a;
      --cyan: #475569;
      --panel: rgba(255, 255, 255, 0.6);
      --line: rgba(15, 23, 42, 0.08);
      --bar-bg: rgba(255, 255, 255, 0.6);
      --shadow: 0 30px 60px -25px rgba(15, 23, 42, 0.15);
      --lvl0: #e2e8f0;
      --lvl1: #cbd5e1;
      --lvl2: #94a3b8;
      --lvl3: #475569;
      --lvl4: #0f172a;
    }

    .dark {
      --wall-a: #09090b;
      --wall-b: #0f0f11;
      --blob1: #18181b;
      --blob2: #27272a;
      --blob3: #18181b;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-brd: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --dim: #71717a;
      --accent: #ffffff;
      --cyan: #a1a1aa;
      --panel: rgba(18, 18, 20, 0.55);
      --line: rgba(255, 255, 255, 0.08);
      --bar-bg: rgba(12, 12, 14, 0.7);
      --shadow: 0 30px 70px -25px rgba(0, 0, 0, 0.8);
      --lvl0: #18181b;
      --lvl1: #27272a;
      --lvl2: #3f3f46;
      --lvl3: #71717a;
      --lvl4: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--wall-a);
      overflow: hidden;
      height: 100vh;
      transition: background-color .4s ease, color .4s ease;
    }

    .disp {
      font-family: 'Outfit', sans-serif;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .hidden {
      display: none !important;
    }

    /* ---------------- wallpaper ---------------- */
    #wallpaper {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(160deg, var(--wall-a), var(--wall-b));
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
    }

    .b1 {
      width: 520px;
      height: 520px;
      background: var(--blob1);
      top: -120px;
      left: -100px;
      animation: float1 22s ease-in-out infinite;
    }

    .b2 {
      width: 460px;
      height: 460px;
      background: var(--blob2);
      bottom: -140px;
      right: -80px;
      animation: float2 26s ease-in-out infinite;
    }

    .b3 {
      width: 380px;
      height: 380px;
      background: var(--blob3);
      top: 30%;
      right: 15%;
      animation: float3 30s ease-in-out infinite;
    }

    @keyframes float1 {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(40px, 60px);
      }
    }

    @keyframes float2 {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-50px, -30px);
      }
    }

    @keyframes float3 {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-30px, 50px);
      }
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--glass-brd);
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s ease;
      text-decoration: none;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .brand-icon {
      width: 15px;
      height: 15px;
      display: block;
    }

    .tag {
      font-size: 10.5px;
      letter-spacing: .03em;
      color: var(--muted);
      border: 1px solid var(--glass-brd);
      border-radius: 999px;
      padding: 3px 9px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .tag .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ================= INTRO (fullscreen About) ================= */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, var(--wall-a), var(--wall-b));
      transition: opacity .35s ease, visibility .35s ease;
    }

    #intro.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-card {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 40px 32px 32px;
      background: var(--glass);
      border: 1px solid var(--glass-brd);
      border-radius: 26px;
      backdrop-filter: blur(24px) saturate(160%);
      box-shadow: var(--shadow);
      perspective: 1400px;
      transform-style: preserve-3d;
      transition: transform .15s ease-out;
      position: relative;
      overflow: hidden;
    }

    #intro-card .glare {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
      background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, 0.25), transparent 45%);
    }

    #intro-card:hover .glare {
      opacity: 1;
    }

    #intro-avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 16px;
      display: block;
      border: 2px solid var(--glass-brd);
      box-shadow: 0 8px 22px -8px rgba(0, 0, 0, .4);
    }

    #intro-avatar-fallback {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff;
      font-weight: 700;
      font-size: 28px;
    }

    #intro-card h1 {
      margin: 0 0 4px;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    #intro-card .handle {
      display: block;
      color: var(--muted);
      font-size: 12.5px;
      margin-bottom: 14px;
    }

    #intro-card .tag-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    #intro-card p {
      margin: 0 0 20px;
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    #intro-socials {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    #intro-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #1a0d05;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 0 12px 24px -10px rgba(224, 96, 42, .5);
    }

    #intro-cta:hover {
      transform: translateY(-2px);
    }

    #intro-cta .chev {
      transition: transform .2s ease;
    }

    /* ================= MAIN UI ================= */
    #main-ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--bar-bg);
      backdrop-filter: blur(18px) saturate(150%);
      cursor: pointer;
    }

    #topbar:hover {
      background: var(--glass-brd);
    }

    #topbar img,
    #topbar-fallback {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    #topbar-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    #topbar-text {
      min-width: 0;
    }

    #topbar-text .n {
      font-weight: 700;
      font-size: 13.5px;
    }

    #topbar-text .t {
      font-size: 11px;
      color: var(--muted);
    }

    #topbar-right {
      margin-left: auto;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #stage-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #stage {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 20px 18px 24px;
    }

    #stage::-webkit-scrollbar {
      width: 8px;
    }

    #stage::-webkit-scrollbar-thumb {
      background: var(--glass-brd);
      border-radius: 99px;
    }

    #stage-inner {
      max-width: 640px;
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .22s ease, transform .22s ease;
    }

    #stage-inner.leaving {
      opacity: 0;
      transform: translateY(10px);
    }

    #stage-inner.entering {
      opacity: 0;
      transform: translateY(-10px);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      backdrop-filter: blur(18px) saturate(150%);
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 700;
    }

    .card .sub {
      font-size: 11.5px;
      color: var(--dim);
      margin-bottom: 14px;
    }

    .kv {
      display: flex;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 12.5px;
    }

    .kv .k {
      color: var(--muted);
      min-width: 88px;
      flex-shrink: 0;
    }

    .kv .v {
      color: var(--text);
    }

    .section-h {
      font-size: 10.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 16px 0 8px;
    }

    .section-h:first-child {
      margin-top: 0;
    }

    /* ---- about stage ---- */
    #about-bio {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 16px;
    }

    .quicklinks {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ---- terminal ---- */
    #term-output {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      line-height: 1.7;
    }

    .tline {
      margin: 0 0 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .tline.out {
      color: var(--muted);
    }

    .tline.hl {
      color: var(--cyan);
    }

    .tline.ok {
      color: #4ade80;
    }

    .tline.err {
      color: var(--accent);
    }

    .tline.prompt .p {
      color: var(--accent);
      font-weight: 700;
    }

    #term-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
    }

    #term-input-row .p {
      color: var(--accent);
      font-weight: 700;
    }

    #term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
    }

    #term-input::placeholder {
      color: var(--dim);
    }

    /* ---- projects ---- */
    .proj-item,
    .repo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
      transition: background .2s ease;
    }

    .proj-item:last-child,
    .repo-item:last-child {
      border-bottom: none;
    }

    .proj-item:hover,
    .repo-item:hover {
      background: var(--glass-brd);
    }

    .proj-item .name,
    .repo-item .name {
      font-weight: 600;
      font-size: 13px;
    }

    .proj-item .meta {
      font-size: 11px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    .repo-item .meta {
      font-size: 11px;
      color: var(--dim);
      display: flex;
      gap: 8px;
      align-items: center;
      font-family: 'IBM Plex Mono', monospace;
      flex-shrink: 0;
    }

    .thirai-badge {
      height: 26px;
      padding: 0 10px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .thirai-badge img {
      height: 13px;
      width: auto;
      display: block;
    }

    /* ---- contributions heatmap ---- */
    #contrib-total {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #contrib-scroll {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    #contrib-months {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 11px;
      gap: 3px;
      margin-bottom: 4px;
      margin-left: 16px;
    }

    #contrib-months span {
      font-size: 9px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
      white-space: nowrap;
    }

    .contrib-row {
      display: flex;
      gap: 6px;
    }

    #contrib-daylabels {
      display: grid;
      grid-template-rows: repeat(7, 11px);
      gap: 3px;
      font-size: 8.5px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    #contrib-daylabels span {
      display: flex;
      align-items: center;
    }

    #contrib-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 11px);
      grid-auto-columns: 11px;
      gap: 3px;
    }

    .contrib-cell {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--lvl0);
    }

    .contrib-cell.l1 {
      background: var(--lvl1);
    }

    .contrib-cell.l2 {
      background: var(--lvl2);
    }

    .contrib-cell.l3 {
      background: var(--lvl3);
    }

    .contrib-cell.l4 {
      background: var(--lvl4);
    }

    #contrib-legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      font-size: 10px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    #contrib-legend .contrib-cell {
      width: 9px;
      height: 9px;
    }

    /* ---- stack ---- */
    .stack-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stack-chip {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stack-chip .n {
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
    }

    .stack-chip .r {
      font-size: 10.5px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
    }

    .flow {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      flex-wrap: wrap;
    }

    .flow span.step {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
    }

    .flow .arrow {
      color: var(--dim);
    }

    /* ---- view-about custom topbar hiding ---- */
    body.view-about #topbar {
      display: none !important;
    }

    /* ---- custom project styles ---- */
    .proj-item.thirai-large {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      transition: background .2s ease, transform .2s ease;
      max-width: 360px;
      margin: 0 auto 16px auto;
    }

    .proj-item.thirai-large:hover {
      background: var(--glass-brd);
      transform: translateY(-2px);
    }

    .mini-projects {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
    }

    .proj-mini {
      flex: 1;
      max-width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      transition: background .2s ease, transform .2s ease;
    }

    .proj-mini:hover {
      background: rgba(224, 96, 42, 0.07);
      transform: translateY(-1px);
    }

    .proj-mini .name {
      font-weight: 600;
      font-size: 13px;
    }

    .proj-mini .meta {
      font-size: 10.5px;
      color: var(--dim);
      margin-top: 2px;
    }

    /* ---- contact ---- */
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item .ic {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--glass-brd);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-item .ic .brand-icon {
      width: 17px;
      height: 17px;
    }

    .contact-item .k {
      font-size: 11px;
      color: var(--dim);
    }

    .contact-item .v {
      font-size: 13px;
      font-weight: 500;
    }

    .copy-btn {
      margin-left: auto;
      font-size: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
    }

    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ================= DOCK (bottom tab bar) ================= */
    #dock {
      flex-shrink: 0;
      display: flex;
      border-top: 1px solid var(--line);
      background: var(--bar-bg);
      backdrop-filter: blur(20px) saturate(160%);
    }

    .dock-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 9px 4px 10px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      position: relative;
      transition: color .2s ease;
    }

    .dock-tab .lbl {
      font-size: 9.5px;
      letter-spacing: .03em;
    }

    .dock-tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      transition: width .2s ease;
    }

    .dock-tab:hover {
      color: var(--muted);
    }

    .dock-tab.active {
      color: var(--accent);
    }

    .dock-tab.active::before {
      width: 26px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="antialiased">

  <div id="wallpaper">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- ================= MAIN UI ================= -->
  <div id="main-ui">
    <div id="topbar" onclick="setStage('about')" title="Back to About">
      <img id="topbar-avatar"
        src="https://media.licdn.com/dms/image/v2/D4E03AQHSnRiNQOlCsQ/profile-displayphoto-crop_800_800/B4EZ6KUcdpI0AQ-/0/1780437076272?e=1786579200&v=beta&t=ELd31e-FTF1O7E0Fcymy1K92kt2kekigruusU2HXtfQ"
        alt="" referrerpolicy="no-referrer">
      <div id="topbar-fallback">NA</div>
      <div id="topbar-text">
        <div class="n">Nithinan Arulganeshan</div>
        <div class="t">@nithinana · London, UK</div>
      </div>
      <div id="topbar-right"></div>

    /* ================= stage switching ================= */
    let currentView = null;
    const stageInner = document.getElementById('stage-inner');
    const stageWrap = document.getElementById('stage');

    function updateDockActive(view) {
      document.querySelectorAll('.dock-tab').forEach(t => t.classList.toggle('active', t.dataset.app === view));
    }

    function setStage(view) {
      if (!templates[view] || currentView === view) return;
      stageInner.classList.add('leaving');
      setTimeout(() => {
        stageInner.innerHTML = templates[view]();
        lucide.createIcons();
        stageWrap.scrollTop = 0;
        stageInner.classList.remove('leaving');
        stageInner.classList.add('entering');
        requestAnimationFrame(() => requestAnimationFrame(() => stageInner.classList.remove('entering')));
        currentView = view;
        updateDockActive(view);
        document.body.classList.toggle('view-about', view === 'about');
        if (view === 'about') {
          wireAvatarFallback('about-avatar', 'about-avatar-fallback');
        }
        if (view === 'cli') initTerminal();
        if (view === 'projects') { fetchRepos(); fetchContributions(); }
      }, 160);
    }

    function dockClick(view) {
      if (currentView === view) { setStage('about'); return; }
      setStage(view);
    }

    /* ================= terminal ================= */
    const responses = {
      whoami: `nithinan arulganeshan — 17, london, developer.`,
      about: `i like working on web applications/design and js stuff here nd there`,
      stack: `html · python · go
ide: vs code, webstorm`,
      education: `former a-level student
-> electronic engineering hopefully`,
      projects: `thirai         thirai.uk       [live]
free periods   /free           [live]
mathspec       /mathspec       [live]`,
      thirai: `thirai — movie site/scraper thing i made.
-> https://thirai.uk`,
      contact: `email     nithinana2009@gmail.com
linkedin  linkedin.com/in/nithinan-arulganeshan-2954bb39b
github    github.com/nithinana
snapchat  nithinan_a`,
      apps: `cli · projects · stack · contact
type 'open <app>' to jump there`,
    };
    const helpText = `available commands:
  whoami · about · stack · education
  projects · thirai · contact · repos
  open <cli|projects|stack|contact>
  apps · clear`;

    let repoData = [];
    function reposAsText() {
      if (!repoData.length) return 'repositories still loading — try again in a second.';
      return repoData.map(r => `${r.name.toLowerCase().padEnd(20)} ${(r.language || 'misc').toLowerCase().padEnd(10)} *${r.stargazers_count}`).join('\n');
    }

    function initTerminal() {
      const termOutput = document.getElementById('term-output');
      const termInput = document.getElementById('term-input');
      const termHistory = []; let hIndex = -1;

      function tPrint(text, cls = '') {
        const p = document.createElement('p');
        p.className = 'tline ' + cls;
        p.textContent = text;
        termOutput.appendChild(p);
      }
      function tPromptLine(cmd) {
        const p = document.createElement('p');
        p.className = 'tline prompt';
        p.innerHTML = `<span class="p">❯</span> ${cmd}`;
        termOutput.appendChild(p);
      }

      function runCmd(raw) {
        const cmd = raw.trim().toLowerCase();
        if (cmd === '') return;
        tPromptLine(cmd);
        termHistory.push(cmd); hIndex = termHistory.length;

        if (cmd === 'clear') { termOutput.innerHTML = ''; return; }
        if (cmd === 'help') { tPrint(helpText, 'out'); return; }
        if (cmd === 'repos') { tPrint(reposAsText(), 'out'); return; }
        if (cmd === 'sudo' || cmd.startsWith('sudo ')) { tPrint('nice one boss', 'err'); return; }
        if (cmd === 'theme dark') { tPrint('already in dark mode.', 'ok'); return; }
        if (cmd === 'theme light') { tPrint('it looked ugly in light mode so i removed it ngl.', 'err'); return; }
        if (cmd.startsWith('open ')) {
          const target = cmd.replace('open ', '').trim();
          const validTargets = ['cli', 'projects', 'stack', 'contact', 'about'];
          if (validTargets.includes(target)) { tPrint(`opening ${target}...`, 'hl'); setTimeout(() => setStage(target), 200); }
          else tPrint(`no such app: ${target} — try 'apps'.`, 'err');
          return;
        }
        if (responses[cmd]) { tPrint(responses[cmd], 'out'); return; }
        tPrint(`command not found: ${cmd} — type 'help' for a list.`, 'err');
      }

      termInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { runCmd(termInput.value); termInput.value = ''; }
        else if (e.key === 'ArrowUp') { if (hIndex > 0) { hIndex--; termInput.value = termHistory[hIndex]; e.preventDefault(); } }
        else if (e.key === 'ArrowDown') {
          if (hIndex < termHistory.length - 1) { hIndex++; termInput.value = termHistory[hIndex]; }
          else { hIndex = termHistory.length; termInput.value = ''; }
          e.preventDefault();
        }
      });

      tPrint('cheeky lil terminal js so it looks geek', 'hl');
      tPrint("type 'help' or 'apps' to do sum.", 'out');
      termInput.focus();
    }

    /* ================= repos ================= */
    const username = 'nithinana';
    async function fetchRepos() {
      const el = document.getElementById('repo-list');
      if (!el) return;
      try {
        const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=12`);
        const data = await res.json();
        repoData = data.filter(r => !r.fork);
        el.innerHTML = '';
        if (!repoData.length) { el.innerHTML = `<div style="color:var(--muted); font-size:12px;">no public, non-fork repositories yet.</div>`; return; }
        repoData.forEach(repo => {
          const a = document.createElement('a');
          a.href = repo.html_url; a.target = '_blank'; a.className = 'repo-item';
          a.innerHTML = `<span class="name">${repo.name.toLowerCase()}</span>
        <span class="meta"><span>${(repo.language || 'misc').toLowerCase()}</span><span style="color:var(--accent)">★ ${repo.stargazers_count}</span></span>`;
          el.appendChild(a);
        });
      } catch (e) {
        el.innerHTML = `<div style="color:var(--muted); font-size:12px;">unable to load repositories.</div>`;
      }
    }

    /* ================= github contributions ================= */
    async function fetchContributions() {
      const totalEl = document.getElementById('contrib-total');
      const gridEl = document.getElementById('contrib-grid');
      const monthsEl = document.getElementById('contrib-months');
      if (!totalEl) return;
      try {
        const res = await fetch('https://github-contributions-api.jogruber.de/v4/nithinana');
        const data = await res.json();
        const all = data.contributions || [];
        all.sort((a, b) => new Date(a.date) - new Date(b.date));
        const recent = all.slice(-371);
        if (!recent.length) { totalEl.textContent = 'no contribution data available.'; return; }

        const firstDay = new Date(recent[0].date + 'T00:00:00').getDay();
        const cells = new Array(firstDay).fill(null).concat(recent);

        gridEl.innerHTML = '';
        let lastMonth = null;
        const monthMarks = [];
        cells.forEach((c, i) => {
          const col = Math.floor(i / 7);
          const div = document.createElement('div');
          div.className = 'contrib-cell' + (c && c.level ? ' l' + c.level : '');
          if (c) {
            div.title = `${c.date}: ${c.count} contribution${c.count === 1 ? '' : 's'}`;
            const m = c.date.slice(0, 7);
            if (m !== lastMonth) { lastMonth = m; monthMarks.push(col); }
          }
          gridEl.appendChild(div);
        });

        const totalCols = Math.ceil(cells.length / 7);
        monthsEl.innerHTML = '';
        monthsEl.style.gridTemplateColumns = `repeat(${totalCols}, 11px)`;
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        for (let i = 0; i < totalCols; i++) {
          const span = document.createElement('span');
          const markIdx = monthMarks.indexOf(i);
          if (markIdx !== -1) {
            const dateStr = cells.find((c, ci) => Math.floor(ci / 7) === i && c)?.date;
            if (dateStr) span.textContent = monthNames[parseInt(dateStr.slice(5, 7), 10) - 1];
          }
          span.style.gridColumn = (i + 1);
          monthsEl.appendChild(span);
        }

        const sum = recent.reduce((s, c) => s + c.count, 0);
        totalEl.textContent = `${sum.toLocaleString()} contributions in the last year`;
      } catch (e) {
        totalEl.textContent = 'unable to load contribution data.';
      }
    }

    /* ================= copy button ================= */
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent; btn.textContent = 'copied';
        setTimeout(() => btn.textContent = old, 1400);
      }).catch(() => { });
    }

    // Automatically load the about stage on startup
    setStage('about');
  </script>
